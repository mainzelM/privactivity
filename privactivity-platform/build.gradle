plugins {
    id 'java-platform'
}

group 'org.privactivity.store'

dependencies {
    constraints {
        api('io.jenetics:jpx:4.0.0')
        api('org.eclipse.store:integrations-spring-boot3:4.1.0')
        api('org.eclipse.serializer:serializer:4.1.0')
