        api('org.openjdk.jmh:jmh-generator-bytecode:1.37')
        api('org.glassfish.jaxb:jaxb-xjc:4.0.9')
        api('org.glassfish.jaxb:jaxb-runtime:4.0.9')
        api('jakarta.xml.bind:jakarta.xml.bind-api:4.0.5')
        api('de.grundid.opendatalab:geojson-jackson:3.0')
        api('com.tngtech.archunit:archunit-junit5:1.4.2')
