<div class="logout-container">
    <mat-card class="logout-card">
        <mat-card-title>Logout</mat-card-title>
        <mat-card-content>
            <p>Do you want to log out?</p>
        </mat-card-content>
        <mat-card-actions>
            <button mat-raised-button color="primary" (click)="logout()">
                <mat-icon>logout</mat-icon>
                Logout
            </button>
        </mat-card-actions>
    </mat-card>
</div>
