privactivity.store.directory=${HOME}/tmp/privactivity
privactivity.store.climb.storage-directory=${privactivity.store.directory}/store/climb/data
privactivity.store.repo.activity.storage-directory=${privactivity.store.directory}/store/fit/data
privactivity.store.metadata.storage-directory=${PRIVATE_DATA_DIR}/metadata/data
privactivity.store.json.storage-directory=/${PRIVATE_DATA_DIR}/json
privactivity.fit.import.directory=${PRIVATE_DATA_DIR}/activities-fit
# External shapefile location (relative to project root in dev mode)
privactivity.fit.import.scheduler.initiaDelay=10d
privactivity.townfinder.shapefile-data-dir=${HOME}/dev/projects/privactivity/activity-store/privactivity-app/data/shapefiles
privactivity.users.file.path=${PRIVATE_DATA_DIR}/users.json
privactivity.bootstrap.admin-password-file.path=${privactivity.store.directory}/admin-password.txt
jwt.dev.private-key-path=${privactivity.store.directory}/jwt/dev/app.key
jwt.dev.public-key-path=${privactivity.store.directory}/jwt/dev/app.pub
# Actuator configuration for development (more permissive)
management.endpoints.web.exposure.include=health,info,metrics,env,configprops,loggers
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
# use trace to debug authentication problems
logging.level.org.springframework.security=info
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG