spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
# Use temporary directories for test storage
privactivity.store.repo.activity.storage-directory=${java.io.tmpdir}/${random.int}/fit
privactivity.store.gpx.storage-directory=${java.io.tmpdir}/${random.int}/gpx
privactivity.store.metadata.storage-directory=${java.io.tmpdir}/${random.int}/metadata
privactivity.store.climb.storage-directory=${java.io.tmpdir}/${random.int}/climb
# Disable actuator security for tests
management.security.enabled=false
management.endpoints.web.exposure.include=*
# Logging
logging.level.root=WARN
logging.level.org.privactivity=INFO